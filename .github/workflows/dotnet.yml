# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  # This job requires a secret token PACKAGE_REPO_TOKEN with write access to the local package repository
  publish-nuget:

    needs: build
    if: github.event_name == 'push'

    runs-on: ubuntu-latest
    env:
      ProjectPath: "./Nt.Automaton.Domain"
      Source: https://nuget.pkg.github.com/Natvs/index.json

    steps:
      - uses: actions/checkout@v7
      - name: Publish to local repository
        uses: Rebel028/publish-nuget@v2.8.0
        with:
          PROJECT_FILE_PATH: ${{env.ProjectPath}}
          NUGET_SOURCE: ${{env.Source}}
          NUGET_KEY: ${{secrets.PACKAGE_REPO_TOKEN}}
          GITHUB_USER: Natvs
