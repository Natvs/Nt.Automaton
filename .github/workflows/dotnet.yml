name: .NET
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
permissions:
  contents: read

env:
  # Project settings
  PROJECT_PATH: "Domain"
  PROJECT_FILE: "Domain.csproj"
  LOCAL_NUGET_REPO: https://nuget.pkg.github.com/Natvs/index.json
  LOCAL_NUGET_USERNAME: Natvs
  NUGET_USERNAME: Natversus      

  # Artifacts paths
  NUGET_PATH: "${{github.workspace}}/nuget"
  SBOM_PATH: "${{github.workspace}}/bom"

  # API
  API_PACKAGE_PATH: /users/natvs/packages/nuget/Nt.Automaton/versions            
  GH_TOKEN: ${{github.token}}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout solution
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  trivy-analysis:
    name: Analyze code with Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  generate-sbom:
    name: Generate SBOM with Trivy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - build
      - trivy-analysis
    permissions:
      contents: read
    steps:
      - name: Checkout solution
        uses: actions/checkout@v7
      - name: Generate SBOM with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'github'
          output: ${{env.SBOM_PATH}}
          scan-ref: '${{env.PROJECT_PATH}}'
          github-pat: ${{github.token}}
      - name: Upload trivy report as a Github artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ${{env.SBOM_PATH}}

  check-release:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      HTML_COMMENT: "<--! ci:release -->"
    steps:
      - name: Checkout solution
        uses: actions/checkout@v7 
      - name: Retrieve version
        id: version
        run: |
          cd ${{env.PROJECT_PATH}}  
          VERSION=$(dotnet msbuild ${{env.PROJECT_FILE}} -getProperty:Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"
      - name: Create tag
        id: tag
        run: |
          TAG="v${{steps.version.outputs.version}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Check release
        id: check
        shell: pwsh
        run: |
          $TAG = "${{steps.tag.outputs.tag}}"
          if (gh release view "$TAG") {     
            echo "create=false" >> "$env:GITHUB_OUTPUT"
            echo "Release $TAG already exists. No release will be created."
          } else {     
            echo "create=true" >> "$env:GITHUB_OUTPUT"
            echo "Release $TAG does not exist. A new release will be created."
          }
          exit 0
      - name: Delete previous comment
        shell: pwsh
        run: |
          $comments = gh api `
              "repos/${{github.repository}}/issues/${{env.PR_NUMBER}}/comments" `
              --paginate | ConvertFrom-Json
          $comment = $comments |
              Where-Object { $_.body -like '*${{env.HTML_COMMENT}}*' } |
              Select-Object -Last 1    
          if ($null -ne $comment) {
              gh api `
                  "repos/${{github.repository}}/issues/comments/$comment.id" `
                  -X DELETE   
              Write-Host "Previous comment deleted."
          }
          else {
              Write-Host "No previous comment found."
          }
      - name: Post comment
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          TAG: ${{steps.tag.outputs.tag}}
        run: |
          if (${{steps.check.outputs.create}} == 'true') {
            gh pr comment ${{env.PR_NUMBER}} --body `
              "Information: No release ${{env.TAG}} exists. A new release will be created if the pull request is merged." 
          } else {
            gh pr comment ${{env.PR_NUMBER}} --body `
              "Information: A release ${{env.TAG}} already exists."
          }
    outputs:
      tag: ${{steps.tag.outputs.tag}}
      create-release: ${{steps.check.outputs.create}}

  check-nuget:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      HTML_COMMENT: "<--! ci:package -->"
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve version
        id: version
        run: |
          cd ${{env.PROJECT_PATH}}  
          VERSION=$(dotnet msbuild ${{env.PROJECT_FILE}} -getProperty:PackageVersion)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
      - name: Check package
        id: check
        shell: pwsh
        run: |
          $obj = gh api ${{env.API_PACKAGE_PATH}} | ConvertFrom-Json
          $version = "${{steps.version.outputs.version}}"
          if ($obj.name | Select-String $version) {
            echo "create=false" >> "$env:GITHUB_OUTPUT"
            echo "Package for version $version already exists. No additional to create." 
          } else {
            echo "create=true" >> "$env:GITHUB_OUTPUT"
            echo "Package for version $version inexistant. A new package will be created."
          }
      - name: Delete previous comment
        shell: pwsh
        run: |
          $comments = gh api `
              "repos/${{github.repository}}/issues/${{env.PR_NUMBER}}/comments" `
              --paginate | ConvertFrom-Json
          $comment = $comments |
              Where-Object { $_.body -like '*${{env.HTML_COMMENT}}*' } |
              Select-Object -Last 1    
          if ($null -ne $comment) {
              gh api `
                  "repos/${{github.repository}}/issues/comments/$comment.id" `
                  -X DELETE   
              Write-Host "Previous comment deleted."
          }
          else {
              Write-Host "No previous comment found."
          }
      - name: Post comment
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          VERSION: ${{steps.version.outputs.version}}
        run: |
          if (${{steps.check.outputs.create}} == 'true') {
            gh pr comment ${{env.PR_NUMBER}} --body "Information: No package for version ${{env.VERSION}} exists. A new package will be published if the pull request is merged." 
          } else {
            gh pr comment ${{env.PR_NUMBER}} --body "Information: A package for version ${{env.VERSION}} already exists."
          }
    outputs:
      create-package: ${{steps.check.outputs.create}}

  # This job requires a file release-notes.md in the root of the repository with the release notes for the new release.
  create-release:
    needs:
      - build
      - check-release
      - generate-sbom
    if: github.event_name == 'push' && needs.check-release.outputs.create-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    env:
      title: ${{needs.check-release.outputs.tag}}
      tag: ${{needs.check-release.outputs.tag}}
      release-file: release-notes.md
    steps:
      - name: Checkout solution
        uses: actions/checkout@v7
      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: ${{env.SBOM_PATH}}
      - name: Create release
        run: |
          gh release create \
            ${{env.tag}} \
            "${{env.SBOM_PATH}}/bom.json#sbom.json" \
            --title ${{env.title}}
      - name: Upload release notes
        shell: pwsh
        run: |
            Get-Content ${{env.release-file}} | gh release edit ${{env.tag}} --notes-file -

  pack:
    needs: 
      - build
      - check-nuget
    if: github.event_name == 'push' && needs.check-nuget.outputs.create-package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.NUGET_PATH }} --verbosity quiet
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{env.NUGET_PATH}}
          name: nuget

  publish-local-nuget:
    needs: 
      - pack
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout solution
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          path: ${{env.NUGET_PATH}}
          name: nuget
      - name: Authenticate local package source
        run: |
          dotnet nuget add source \
            ${{ env.LOCAL_NUGET_REPO }} \
            --name github \
            --username ${{ env.LOCAL_NUGET_USERNAME }} \
            --password ${{ github.token }} \
            --store-password-in-clear-text
      - name: Publish on local NuGet repository
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ env.NUGET_PATH }}" -Filter "*.nupkg" | ForEach-Object {
              dotnet nuget push $_.FullName --source "github" --skip-duplicate
          }


  publish-nuget:
    needs: 
      - pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout solution
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download Nuget
        uses: actions/download-artifact@v8
        with:
          path: ${{env.NUGET_PATH}}
          name: nuget
      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{env.NUGET_USERNAME}}
      - name: Publish on NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ env.NUGET_PATH }}" -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package
          }



    
